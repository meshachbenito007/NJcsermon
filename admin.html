<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon Admin</title><link rel="stylesheet" href="style.css"></head>
<body><div class="background"></div><div class="admin-page"><div class="glass admin-box"><a href="index.html">← View Website</a><p class="gold">NEW JERUSALEM CHURCH</p><h1>Sermon Admin Panel</h1>
<div id="loginBox"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="button" onclick="login()">Login</button><p id="loginMessage"></p></div>
<div id="panel" style="display:none"><div class="admin-top"><h2>Add New Sermon</h2><button onclick="logout()">Logout</button></div>
<label>Sermon Topic</label><input id="topic" placeholder="Enter sermon topic"><label>Speaker</label><input id="speaker" placeholder="Pastor name"><label>Date</label><input id="date" type="date"><label>Sermon Image</label><input id="image" type="file" accept="image/*"><label>Audio MP3</label><input id="audio" type="file" accept="audio/mpeg,audio/mp3"><button class="button" onclick="addSermon()">Publish Sermon</button><p id="message"></p><h2>Published Sermons</h2><div id="adminList"></div></div>
<!-- UPCOMING EVENTS -->
<section class="admin-section">

    <h2>📅 Add Upcoming Event</h2>

    <form id="eventForm">

        <div class="form-group">
            <label>Event Title</label>
            <input
                type="text"
                id="eventTitle"
                placeholder="Example: Annual Church Anniversary"
                required
            >
        </div>

        <div class="form-group">
            <label>Event Date</label>
            <input
                type="date"
                id="eventDate"
                required
            >
        </div>

        <div class="form-group">
            <label>Event Time</label>
            <input
                type="text"
                id="eventTime"
                placeholder="Example: 6:00 PM"
            >
        </div>

        <div class="form-group">
            <label>Location</label>
            <input
                type="text"
                id="eventLocation"
                placeholder="New Jerusalem Church"
            >
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea
                id="eventDescription"
                placeholder="Enter event details"
                rows="4"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Event Image URL</label>
            <input
                type="url"
                id="eventImage"
                placeholder="https://..."
            >
        </div>

        <button type="submit">
            📅 Add Event
        </button>

    </form>

    <p id="eventMessage"></p>

</section>
<section class="admin-section">

    <h2>📸 Add Gallery Media</h2>

    <form id="galleryForm">

        <div class="form-group">

            <label>Title</label>

            <input
                type="text"
                id="galleryTitle"
                placeholder="Example: 58th Anniversary Celebration"
                required
            >

        </div>


        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                id="galleryDate"
                required
            >

        </div>


        <div class="form-group">

            <label>Media Type</label>

            <select id="galleryType" required>

                <option value="photo">
                    📷 Photo
                </option>

                <option value="video">
                    🎥 Video
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Photo / Video</label>

            <input
                type="file"
                id="galleryFile"
                accept="image/*,video/*"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                id="galleryDescription"
                rows="4"
                placeholder="Enter details about this celebration"
            ></textarea>

        </div>


        <button type="submit">

            📤 Upload Gallery Media

        </button>
<button onclick="deletePhoto('PHOTO_ID', 'PHOTO_FILE_NAME')">
  Delete
</button>

    </form>


    <p id="galleryMessage"></p>

</section>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
