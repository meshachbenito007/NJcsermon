<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon Admin</title><link rel="stylesheet" href="style.css"></head>
<body><div class="background"></div><div class="admin-page"><div class="glass admin-box"><a href="index.html">← View Website</a><p class="gold">NEW JERUSALEM CHURCH</p><h1>Sermon Admin Panel</h1>
<div id="loginBox"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="button" onclick="login()">Login</button><p id="loginMessage"></p></div>
<div id="panel" style="display:none"><div class="admin-top"><h2>Add New Sermon</h2><button onclick="logout()">Logout</button></div>
<label>Sermon Topic</label><input id="topic" placeholder="Enter sermon topic"><label>Speaker</label><input id="speaker" placeholder="Pastor name"><label>Date</label><input id="date" type="date"><label>Sermon Image</label><input id="image" type="file" accept="image/*"><label>Audio MP3</label><input id="audio" type="file" accept="audio/mpeg,audio/mp3"><button class="button" onclick="addSermon()">Publish Sermon</button><p id="message"></p><h2>Published Sermons</h2><div id="adminList"></div>
<!-- UPCOMING EVENTS -->

<section class="admin-section">

    <h2>📅 Manage Upcoming Events</h2>

    <form id="eventForm">

        <input
            type="hidden"
            id="eventId"
        >

        <div class="form-group">
            <label>Event Title</label>

            <input
                type="text"
                id="eventTitle"
                placeholder="Example: Church Anniversary"
                required
            >
        </div>

        <div class="form-group">
            <label>Event Date</label>

            <input
                type="date"
                id="eventDate"
                required
            >
        </div>

        <div class="form-group">
            <label>Event Time</label>

            <input
                type="text"
                id="eventTime"
                placeholder="Example: 6:00 PM"
            >
        </div>

        <div class="form-group">
            <label>Location</label>

            <input
                type="text"
                id="eventLocation"
                placeholder="New Jerusalem Church"
            >
        </div>

        <div class="form-group">
            <label>Description</label>

            <textarea
                id="eventDescription"
                rows="4"
                placeholder="Event details"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Event Image URL</label>

            <input
                type="url"
                id="eventImage"
                placeholder="https://..."
            >
        </div>

        <button
            type="submit"
            id="eventSubmitButton"
        >
            📅 Add Event
        </button>

        <button
            type="button"
            id="eventCancelButton"
            style="display:none;"
        >
            Cancel Edit
        </button>

    </form>

    <p id="eventMessage"></p>


    <!-- Existing Events -->

    <div id="adminEventsList">

        <p>Loading events...</p>

    </div>

</section></div>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
